name: Bug report
description: Report a reproducible Passwall problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, pairing data, private addresses, clipboard contents, or private paths. Report vulnerabilities through SECURITY.md.
  - type: input
    id: version
    attributes:
      label: Passwall version
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - macOS controller
        - Windows receiver
        - Input or gestures
        - Clipboard
        - File transfer
        - Pairing or connection
        - Build or packaging
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include macOS/Windows versions and display scaling, but remove device names and private addresses.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed credentials, private paths, addresses, pairing data, clipboard contents, and private filenames.
          required: true
