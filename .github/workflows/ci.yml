name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the version in VERSION after both platform jobs pass
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test Swift packages
        run: swift test
      - name: Build and package macOS app
        run: ./script/build_and_run.sh --package
      - name: Build and inspect macOS installer
        run: bash script/package-macos-installer.sh
      - name: Install macOS package on disposable runner
        run: |
          sudo installer -pkg dist/Passwall.pkg -target /
          codesign --verify --deep --strict /Applications/Passwall.app
          diff -qr .build/Passwall.app /Applications/Passwall.app
          sudo installer -pkg dist/Passwall.pkg -target /
          codesign --verify --deep --strict /Applications/Passwall.app
          sudo rm -rf /Applications/Passwall.app
          sudo pkgutil --forget com.passwall.mac.pkg
      - name: Verify macOS archive
        run: cd dist && shasum -a 256 -c Passwall.zip.sha256 Passwall.pkg.sha256
      - uses: actions/upload-artifact@v7
        with:
          name: Passwall-macOS-unsigned
          path: |
            dist/Passwall.zip
            dist/Passwall.zip.sha256
            dist/Passwall.pkg
            dist/Passwall.pkg.sha256

  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Run receiver checks
        run: dotnet run --project Windows\PasswallReceiver.Checks\PasswallReceiver.Checks.csproj -c Release
      - name: Build receiver
        run: dotnet build Windows\PasswallReceiver\PasswallReceiver.csproj -c Release --nologo
      - name: Package Windows receiver
        shell: powershell
        run: |
          choco install nsis --version=3.12 -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw "NSIS install failed" }
          .\Windows\package-release.ps1
      - name: Verify installer lifecycle on disposable runner
        shell: powershell
        run: .\Windows\test-installer.ps1
      - name: Verify Windows archive
        shell: powershell
        run: |
          $archive = "dist\Passwall-Windows-win-x64.zip"
          $expected = (Get-Content "$archive.sha256").Split()[0]
          $actual = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw "Windows archive checksum mismatch" }
      - uses: actions/upload-artifact@v7
        with:
          name: Passwall-Windows-win-x64-unsigned
          path: |
            dist/Passwall-Windows-win-x64.zip
            dist/Passwall-Windows-win-x64.zip.sha256
            dist/Passwall-Setup.exe
            dist/Passwall-Setup.exe.sha256

  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          pattern: Passwall-*
          path: release-assets
          merge-multiple: true
      - name: Publish unsigned public alpha installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="v$(tr -d '\r\n' < VERSION)"
          assets=(
            release-assets/Passwall-Setup.exe
            release-assets/Passwall-Setup.exe.sha256
            release-assets/Passwall.pkg
            release-assets/Passwall.pkg.sha256
          )
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "${assets[@]}" --clobber
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Passwall $tag Public Alpha" --prerelease --notes-file docs/RELEASE_NOTES.md "${assets[@]}"
          fi
